name: build

# Собираем плеер MinGW-w64 и прогоняем все самотесты на каждый push.
# Сборка статическая, поэтому проверяется ровно тот же сценарий, что и локально:
# build.bat плюс запуск test_*.exe из корня проекта.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # В образе windows-latest нет MinGW-w64, зато msys2 раскладывает его
      # в привычную структуру mingw64\bin\g++.exe — какую и ждёт build.bat.
      - name: Установить MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Собрать плеер и тесты
        shell: cmd
        run: |
          set "MINGW_HOME=C:\msys64\mingw64"
          build.bat

      - name: Прогнать самотесты
        shell: cmd
        run: |
          dist\test_core.exe
          if errorlevel 1 exit /b 1
          dist\test_playlist.exe
          if errorlevel 1 exit /b 1
          dist\test_tags.exe
          if errorlevel 1 exit /b 1
          dist\test_settings.exe
          if errorlevel 1 exit /b 1

      - name: Сохранить собранное
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlayer-windows
          path: dist/*.exe
          if-no-files-found: error
