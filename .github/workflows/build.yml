name: build

# Собираем плеер MinGW-w64 и прогоняем все самотесты на каждый push.
# Сценарий тот же, что и локально: build.bat плюс запуск test_*.exe из корня.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # В образе windows-latest нет MinGW-w64, поэтому ставим его через msys2.
      # build.bat сам найдёт g++ и windres в PATH, если по привычному пути пусто.
      - name: Установить MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Собрать плеер и тесты
        shell: msys2 {0}
        run: |
          cd "${GITHUB_WORKSPACE}"
          cmd //c build.bat

      - name: Прогнать самотесты
        shell: msys2 {0}
        run: |
          cd "${GITHUB_WORKSPACE}"
          ./dist/test_core.exe
          ./dist/test_playlist.exe
          ./dist/test_tags.exe
          ./dist/test_settings.exe

      - name: Сохранить собранное
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlayer-windows
          path: dist/*.exe
          if-no-files-found: error
